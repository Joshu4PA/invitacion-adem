<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creador de Invitaciones — Festival Familiar ADEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#4ade80;
    --spring-green:#22c55e;
    --yellow:#facc15;
    --purple:#c084fc;
    --ink:#f8fafc;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh; font-family:'Outfit', sans-serif; color:var(--ink);
    background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .generator-card{
    width:100%; max-width:440px;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(14px);
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius:26px; padding:30px 20px; text-align:center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.7);
  }
  .church-logo {
    width: 170px;
    max-width: 100%;
    height: auto;
    margin: 0 auto 16px;
    display: block;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
  }
  h1{
    font-family:'Baloo 2', sans-serif; font-size:22px; color:#fff; margin-bottom:6px;
  }
  p{ font-size:13px; color:#94a3b8; margin-bottom:20px; font-weight:600; }
  .input-group{ text-align:left; margin-bottom:15px; }
  label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#4ade80; font-weight:800; margin-bottom:6px; }
  input[type="text"]{
    width:100%; padding:12px 16px; border-radius:12px;
    background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.2);
    color:#fff; font-size:15px; font-family:'Outfit', sans-serif; outline:none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus{ border-color:var(--green); }
  .btn{
    width:100%; background:linear-gradient(135deg, #15803d, #22c55e);
    color:#fff; border:none; border-radius:12px; padding:12px;
    font-family:'Baloo 2', sans-serif; font-size:16px; font-weight:700;
    cursor:pointer; box-shadow:0 4px 15px rgba(34,197,94,0.3);
    transition: transform 0.2s, opacity 0.2s;
    margin-top:5px;
  }
  .btn:active{ transform:scale(0.98); }
  
  .result-box{
    display:none; margin-top:20px; background: rgba(30, 41, 59, 0.95);
    border: 1px solid rgba(74, 222, 128, 0.4); border-radius:14px; padding:15px;
    text-align:left; animation: fadeIn 0.4s ease forwards;
  }
  .result-box h3{ font-family:'Baloo 2', sans-serif; font-size:14px; color:#4ade80; margin-bottom:8px; }
  .url-display{
    background: #0f172a; padding:8px 10px; border-radius:8px; font-size:11px;
    color:#cbd5e1; word-break:break-all; border:1px solid rgba(255,255,255,0.1);
    margin-bottom:10px;
  }
  .actions{ display:flex; gap:8px; }
  .btn-action{
    flex:1; padding:9px; border-radius:8px; border:none; font-weight:700; font-size:12px;
    cursor:pointer; font-family:'Outfit', sans-serif; text-align:center; text-decoration:none;
    display:inline-flex; align-items:center; justify-content:center; gap:4px;
  }
  .btn-copy{ background:#334155; color:#fff; }
  .btn-wa{ background:#25d366; color:#fff; }
  
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

  <div class="generator-card">
    <!-- Logo de la iglesia ADEM Ministerios -->
    <img src="Diseño sin título.png" alt="Logo ADEM Ministerios" class="church-logo">

    <h1>🌻 Creador de Invitaciones</h1>
    <p>Festival Familiar ADEM — Edición Primavera</p>

    <div class="input-group">
      <label for="nombreInvitado">Nombre de la persona o familia a invitar:</label>
      <input type="text" id="nombreInvitado" placeholder="Ej. Familia Pérez o Carlos Gómez">
    </div>

    <button class="btn" onclick="generarEnlace()">¡Generar Invitación! 🚀</button>

    <div class="result-box" id="resultBox">
      <h3>¡Enlace listo para enviar!</h3>
      <div class="url-display" id="urlDisplay"></div>
      <div class="actions">
        <button class="btn-action btn-copy" onclick="copiarEnlace()">📋 Copiar</button>
        <a id="waLink" class="btn-action btn-wa" href="#" target="_blank">💬 WhatsApp</a>
      </div>
    </div>
  </div>

<script>
  function generarEnlace() {
    const input = document.getElementById('nombreInvitado').value.trim();
    if(!input) {
      alert('Por favor ingresa un nombre.');
      return;
    }

    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
    const invitacionUrl = baseUrl + 'invitacion.html?nombre=' + encodeURIComponent(input);

    document.getElementById('urlDisplay').textContent = invitacionUrl;
    
    const mensajeWA = `¡Hola! ${input}, te compartimos una invitación especial para el Festival Familiar ADEM - Edición Primavera 🌸: ${invitacionUrl}`;
    document.getElementById('waLink').href = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensajeWA)}`;

    document.getElementById('resultBox').style.display = 'block';
  }

  function copiarEnlace() {
    const textoUrl = document.getElementById('urlDisplay').textContent;
    navigator.clipboard.writeText(textoUrl).then(() => {
      alert('¡Enlace copiado al portapapeles!');
    });
  }
</script>

</body>
</html>
